<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- 読み込むのは同梱ファイルだけ。端末出力が外部へ通信することは無いので全面的に塞ぐ。
     (xterm.js が実行時に <style> を差し込むため style だけ inline を許可する) -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
<title>kanaterm</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
<style>
  /* 配色ごとの色は presets.js が持ち、renderer.js がここへ流し込む。
     初期値はダーク(既定)と同じ値にしてあるので、設定が届く前の一瞬でも
     ちらつかない。実際の値は applySidebarTheme() を参照。 */
  :root {
    --term-bg: #1e1e2e;
    --sidebar-bg: #181825;
    --sidebar-active-bg: #313244;
    --sidebar-hover-bg: #262637;
    --sidebar-border: #313244;
    --sidebar-text: #cdd6f4;
    --input-bg: #313244;
    --input-border: #585b70;
    --dot-none: #585b70;
    --dot-idle: #a6e3a1;
    --dot-busy: #f9e2af;
    --dot-waiting: #f38ba8;
    --accent: #89b4fa;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--term-bg);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: row;
  }

  #tabbar {
    display: flex;
    flex-direction: column;
    width: 200px;
    height: 100vh;
    background: var(--sidebar-bg);
    flex-shrink: 0;
    border-right: 1px solid var(--sidebar-border);
  }
  #tab-list {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
  }
  /* タブの色分けは左端の帯(border-left)で表す。
     以前は行全体の背景を色にしていたが、その上に文字を読ませる都合で色を
     暗く抑えるしかなく、色が弱いうえに配色を切り替えても追従できなかった。
     帯なら文字の可読性と無関係なので、彩度を上げられる。
     帯の色はJS側でタブごとに指定する(インラインstyle)。 */
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    color: var(--sidebar-text);
    font: 12px "UDEV Gothic LG", "BIZ UDGothic", sans-serif;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--sidebar-border);
    border-left: 5px solid transparent;
    cursor: pointer;
  }
  .tab:hover {
    background: var(--sidebar-hover-bg);
  }
  /* 帯を色分けに使うので、アクティブ表示は背景と太字で表す。
     以前使っていた filter: brightness() はタブの色そのものを変えてしまい、
     アクティブかどうかで同じ色が違って見えるため使わない。 */
  .tab.active {
    background: var(--sidebar-active-bg);
  }
  .tab.active .label {
    font-weight: bold;
  }
  /* タブごとのClaude Codeの状態。既定(灰)は「claudeが動いていない」。
     色分けは左の帯なので、●とは表示チャンネルが競合しない。 */
  .tab .status-dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-none);
  }
  .tab .status-dot.idle {
    background: var(--dot-idle);
  }
  .tab .status-dot.busy {
    background: var(--dot-busy);
  }
  .tab .status-dot.waiting {
    background: var(--dot-waiting);
    animation: dot-blink 1.1s steps(1, end) infinite;
  }
  @keyframes dot-blink {
    50% {
      opacity: 0.2;
    }
  }

  /* シェルが終了したタブ(打っても反応しない)を見た目で区別する */
  .tab.exited .label {
    opacity: 0.5;
    text-decoration: line-through;
  }
  .tab.drag-over {
    box-shadow: inset 0 2px 0 var(--accent);
  }
  .tab .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab .rename-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: inherit;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 2px;
    padding: 1px 4px;
  }
  .tab .close {
    opacity: 0.6;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .tab .close:hover {
    opacity: 1;
    color: var(--dot-waiting);
  }
  #new-tab-btn {
    height: 34px;
    color: var(--sidebar-text);
    background: var(--sidebar-bg);
    border: none;
    border-top: 1px solid var(--sidebar-border);
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #new-tab-btn:hover {
    background: var(--sidebar-hover-bg);
  }

  #panes {
    position: relative;
    flex: 1;
    height: 100vh;
  }
  .pane {
    position: absolute;
    inset: 0;
    padding: 4px;
    box-sizing: border-box;
    /* display:none だと非表示中に要素サイズが0になり、xterm.jsの初期化が
       壊れるため、レイアウト上のサイズは保った状態で見た目だけ隠す */
    visibility: hidden;
  }
  .pane.active {
    visibility: visible;
  }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tab-list"></div>
    <button id="new-tab-btn" title="新規タブ (Ctrl+Shift+T)">＋</button>
  </div>
  <div id="panes"></div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="presets.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- 読み込むのは同梱ファイルだけ。端末出力が外部へ通信することは無いので全面的に塞ぐ。
     (xterm.js が実行時に <style> を差し込むため style だけ inline を許可する) -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
<title>kanaterm</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
<style>
  /* ①②★※ などの「東アジア曖昧幅」の文字だけ、半角設計のフォントから採る。
     日本語フォントはこれらを全角で描くが、端末も Claude Code も1セルとして
     数えるため、そのままだと次の文字に重なってしまう(詳細は presets.js)。
     Consolas は Windows に標準で入っており、これらを半角で持っている。
     unicode-range で対象を限定しているので、他の文字には影響しない。
     Consolas が無い環境では単に無視され、rescaleOverlappingGlyphs 側で処理される。 */
  @font-face {
    font-family: "kanaterm-narrow-ambiguous";
    src: local("Consolas");
    unicode-range:
      U+00A1, U+00A4, U+00A7-00A8, U+00AA, U+00AD-00AE, U+00B0-00B4,
      U+00B6-00BA, U+00BC-00BF, U+00C6, U+00D0, U+00D7-00D8, U+00DE-00E1,
      U+00E6, U+00E8-00EA, U+00EC-00ED, U+00F0, U+00F2-00F3, U+00F7-00FA,
      U+00FC, U+00FE, U+2010, U+2013-2016, U+2018-2019, U+201C-201D,
      U+2020-2022, U+2024-2027, U+2030, U+2032-2033, U+2035, U+203B,
      U+203E, U+2074, U+207F, U+2081-2084, U+20AC, U+2103, U+2105,
      U+2109, U+2113, U+2116, U+2121-2122, U+2126, U+212B, U+2153-2154,
      U+215B-215E, U+2160-216B, U+2170-2179, U+2189, U+2190-2199,
      U+21B8-21B9, U+21D2, U+21D4, U+21E7, U+2200, U+2202-2203,
      U+2207-2208, U+220B, U+220F, U+2211, U+2215, U+221A, U+221D-2220,
      U+2223, U+2225, U+2227-222C, U+222E, U+2234-2237, U+223C-223D,
      U+2248, U+224C, U+2252, U+2260-2261, U+2264-2267, U+226A-226B,
      U+226E-226F, U+2282-2283, U+2286-2287, U+2295, U+2299, U+22A5,
      U+22BF, U+2312, U+2460-24E9, U+24EB-254B, U+2550-2573, U+2580-258F,
      U+2592-2595, U+25A0-25A1, U+25A3-25A9, U+25B2-25B3, U+25B6-25B7,
      U+25BC-25BD, U+25C0-25C1, U+25C6-25C8, U+25CB, U+25CE-25D1,
      U+25E2-25E5, U+25EF, U+2605-2606, U+2609, U+260E-260F, U+2614-2615,
      U+261C, U+261E, U+2640, U+2642, U+2660-2661, U+2663-2665,
      U+2667-266A, U+266C-266D, U+266F, U+273D, U+2776-277F;
  }

  /* 配色ごとの色は presets.js が持ち、renderer.js がここへ流し込む。
     初期値はダーク(既定)と同じ値にしてあるので、設定が届く前の一瞬でも
     ちらつかない。実際の値は applySidebarTheme() を参照。 */
  :root {
    --term-bg: #1e1e2e;
    --sidebar-bg: #181825;
    --sidebar-active-bg: #313244;
    --sidebar-hover-bg: #262637;
    --sidebar-border: #313244;
    --sidebar-text: #cdd6f4;
    --input-bg: #313244;
    --input-border: #585b70;
    --dot-none: #585b70;
    --dot-idle: #a6e3a1;
    --dot-busy: #f9e2af;
    --dot-waiting: #f38ba8;
    --accent: #89b4fa;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--term-bg);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: row;
  }

  #tabbar {
    display: flex;
    flex-direction: column;
    width: 200px;
    height: 100vh;
    background: var(--sidebar-bg);
    flex-shrink: 0;
    border-right: 1px solid var(--sidebar-border);
  }
  #tab-list {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
  }
  /* タブの色分けは左端の帯(border-left)で表す。
     以前は行全体の背景を色にしていたが、その上に文字を読ませる都合で色を
     暗く抑えるしかなく、色が弱いうえに配色を切り替えても追従できなかった。
     帯なら文字の可読性と無関係なので、彩度を上げられる。
     帯の色はJS側でタブごとに指定する(インラインstyle)。 */
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    color: var(--sidebar-text);
    font: 12px "UDEV Gothic LG", "BIZ UDGothic", sans-serif;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--sidebar-border);
    border-left: 5px solid transparent;
    cursor: pointer;
  }
  .tab:hover {
    background: var(--sidebar-hover-bg);
  }
  /* 帯を色分けに使うので、アクティブ表示は背景と太字で表す。
     以前使っていた filter: brightness() はタブの色そのものを変えてしまい、
     アクティブかどうかで同じ色が違って見えるため使わない。 */
  .tab.active {
    background: var(--sidebar-active-bg);
  }
  .tab.active .label {
    font-weight: bold;
  }
  /* タブごとのClaude Codeの状態。既定(灰)は「claudeが動いていない」。
     色分けは左の帯なので、●とは表示チャンネルが競合しない。 */
  .tab .status-dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-none);
  }
  .tab .status-dot.idle {
    background: var(--dot-idle);
  }
  .tab .status-dot.busy {
    background: var(--dot-busy);
  }
  .tab .status-dot.waiting {
    background: var(--dot-waiting);
    animation: dot-blink 1.1s steps(1, end) infinite;
  }
  @keyframes dot-blink {
    50% {
      opacity: 0.2;
    }
  }

  /* シェルが終了したタブ(打っても反応しない)を見た目で区別する */
  .tab.exited .label {
    opacity: 0.5;
    text-decoration: line-through;
  }
  .tab.drag-over {
    box-shadow: inset 0 2px 0 var(--accent);
  }
  .tab .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab .rename-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: inherit;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 2px;
    padding: 1px 4px;
  }
  .tab .close {
    opacity: 0.6;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .tab .close:hover {
    opacity: 1;
    color: var(--dot-waiting);
  }
  #new-tab-btn {
    height: 34px;
    color: var(--sidebar-text);
    background: var(--sidebar-bg);
    border: none;
    border-top: 1px solid var(--sidebar-border);
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #new-tab-btn:hover {
    background: var(--sidebar-hover-bg);
  }

  #panes {
    position: relative;
    flex: 1;
    height: 100vh;
  }
  .pane {
    position: absolute;
    inset: 0;
    padding: 4px;
    box-sizing: border-box;
    /* display:none だと非表示中に要素サイズが0になり、xterm.jsの初期化が
       壊れるため、レイアウト上のサイズは保った状態で見た目だけ隠す */
    visibility: hidden;
  }
  .pane.active {
    visibility: visible;
  }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tab-list"></div>
    <button id="new-tab-btn" title="新規タブ (Ctrl+Shift+T)">＋</button>
  </div>
  <div id="panes"></div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="presets.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

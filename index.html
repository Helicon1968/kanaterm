<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- 読み込むのは同梱ファイルだけ。端末出力が外部へ通信することは無いので全面的に塞ぐ。
     (xterm.js が実行時に <style> を差し込むため style だけ inline を許可する) -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
<title>kanaterm</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1e1e2e;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: row;
  }

  #tabbar {
    display: flex;
    flex-direction: column;
    width: 200px;
    height: 100vh;
    background: #181825;
    flex-shrink: 0;
    border-right: 1px solid #313244;
  }
  #tab-list {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    color: #cdd6f4;
    font: 12px "UDEV Gothic LG", "BIZ UDGothic", sans-serif;
    background: #181825;
    border-bottom: 1px solid #313244;
    border-left: 3px solid transparent;
    cursor: pointer;
  }
  /* 背景色はJS側でタブごとに直接指定する(インラインstyle)ため、
     アクティブ状態は背景の上書きではなく、左のアクセント線+明るさで表す。
     こうしないとタブ固有の色(インラインstyle)がクラスの背景指定に勝ってしまい、
     アクティブ表示が効かなくなる。 */
  .tab.active {
    border-left-color: #89b4fa;
    filter: brightness(1.2);
  }
  /* シェルが終了したタブ(打っても反応しない)を見た目で区別する */
  .tab.exited .label {
    opacity: 0.5;
    text-decoration: line-through;
  }
  .tab.drag-over {
    box-shadow: inset 0 2px 0 #89b4fa;
  }
  .tab .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab .rename-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: inherit;
    background: #313244;
    border: 1px solid #585b70;
    border-radius: 2px;
    padding: 1px 4px;
  }
  .tab .close {
    opacity: 0.6;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .tab .close:hover {
    opacity: 1;
    color: #f38ba8;
  }
  #new-tab-btn {
    height: 34px;
    color: #cdd6f4;
    background: #181825;
    border: none;
    border-top: 1px solid #313244;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #new-tab-btn:hover {
    background: #313244;
  }

  #panes {
    position: relative;
    flex: 1;
    height: 100vh;
  }
  .pane {
    position: absolute;
    inset: 0;
    padding: 4px;
    box-sizing: border-box;
    /* display:none だと非表示中に要素サイズが0になり、xterm.jsの初期化が
       壊れるため、レイアウト上のサイズは保った状態で見た目だけ隠す */
    visibility: hidden;
  }
  .pane.active {
    visibility: visible;
  }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tab-list"></div>
    <button id="new-tab-btn" title="新規タブ (Ctrl+Shift+T)">＋</button>
  </div>
  <div id="panes"></div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="presets.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
